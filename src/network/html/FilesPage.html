<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Files - TrailInk</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8; color: #333;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    h2 { font-size: 16px; margin: 0; }
    .nav-links { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .nav-links a {
      padding: 6px 12px; border-radius: 6px; text-decoration: none;
      background: #fff; color: #34495e; border: 1px solid #dfe4e8; font-size: 14px;
    }
    .nav-links a.active { background: #34495e; color: #fff; border-color: #34495e; }
    .card {
      background: #fff; border: 1px solid #dfe4e8; border-radius: 8px;
      padding: 12px; margin-bottom: 12px;
    }
    .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    button {
      font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 6px;
      border: 1px solid #dfe4e8; background: #fff; color: #2c3e50; cursor: pointer;
    }
    button:hover { background: #eef1f4; }
    button.danger { color: #c0392b; border-color: #e8c4bf; }
    button:disabled { opacity: .45; cursor: default; }
    #crumbs { font-size: 14px; margin-bottom: 8px; word-break: break-all; }
    #crumbs a { color: #2980b9; text-decoration: none; cursor: pointer; }
    #summary { color: #7f8c8d; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eef1f4; }
    th { color: #7f8c8d; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    td.size, th.size { text-align: right; white-space: nowrap; color: #7f8c8d; }
    td.name { word-break: break-all; }
    td.name a { color: #2980b9; text-decoration: none; cursor: pointer; }
    td.act { white-space: nowrap; text-align: right; }
    td.act button { padding: 4px 8px; font-size: 13px; }
    .chk { width: 28px; }
    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
      align-items: center; justify-content: center; padding: 16px; z-index: 10;
    }
    .overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 8px; padding: 16px; width: 100%; max-width: 420px; }
    .modal h3 { margin: 0 0 12px; font-size: 16px; }
    .modal input[type=text], .modal input[type=file] {
      width: 100%; font: inherit; font-size: 14px; padding: 8px;
      border: 1px solid #dfe4e8; border-radius: 6px; margin-bottom: 12px;
    }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; }
    #progress { font-size: 13px; color: #7f8c8d; margin-bottom: 12px; min-height: 18px; }
    #status { color: #95a5a6; font-size: 13px; text-align: center; }
    #toast {
      display: none; position: fixed; left: 16px; right: 16px; bottom: 16px;
      background: #2c3e50; color: #fff; padding: 10px 14px; border-radius: 6px;
      font-size: 14px; z-index: 20;
    }
  </style>
</head>
<body>
<h1>&#128506; TrailInk</h1>

<div class="nav-links">
  <a href="/">Home</a>
  <a href="/files" class="active">File Manager</a>
  <a href="/settings">Settings</a>
</div>

<div class="card">
  <div class="bar">
    <h2>&#128193; Files</h2>
    <span style="flex:1"></span>
    <button onclick="openUpload()">Upload</button>
    <button onclick="openMkdir()">New Folder</button>
    <button class="danger" id="delSelBtn" onclick="deleteSelected()" disabled>Delete Selected</button>
  </div>
  <div id="crumbs"></div>
  <div id="listing">Loading&hellip;</div>
  <div id="summary"></div>
</div>

<div class="card"><div id="status"></div></div>

<div class="overlay" id="uploadModal">
  <div class="modal">
    <h3>Upload to <span id="uploadDest"></span></h3>
    <input type="file" id="uploadInput" multiple />
    <div id="progress"></div>
    <div class="row">
      <button onclick="closeModal('uploadModal')">Close</button>
      <button id="uploadGo" onclick="startUpload()">Upload</button>
    </div>
  </div>
</div>

<div class="overlay" id="mkdirModal">
  <div class="modal">
    <h3>New Folder</h3>
    <input type="text" id="mkdirName" placeholder="Folder name" />
    <div class="row">
      <button onclick="closeModal('mkdirModal')">Cancel</button>
      <button onclick="doMkdir()">Create</button>
    </div>
  </div>
</div>

<div class="overlay" id="renameModal">
  <div class="modal">
    <h3>Rename</h3>
    <input type="text" id="renameName" placeholder="New name" />
    <div class="row">
      <button onclick="closeModal('renameModal')">Cancel</button>
      <button onclick="doRename()">Rename</button>
    </div>
  </div>
</div>

<div class="overlay" id="moveModal">
  <div class="modal">
    <h3>Move</h3>
    <input type="text" id="moveDest" placeholder="/target/folder/name.ext" />
    <div class="row">
      <button onclick="closeModal('moveModal')">Cancel</button>
      <button onclick="doMove()">Move</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var currentPath = '/';
var entries = [];
var renameTarget = '';
var moveTarget = '';

// All names go into the DOM via textContent / createTextNode, never innerHTML,
// so a file called `<img onerror=...>` cannot execute.
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function join(dir, name) {
  return dir === '/' ? '/' + name : dir + '/' + name;
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 3500);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function drawCrumbs() {
  var parts = currentPath.split('/').filter(Boolean);
  var frag = document.createDocumentFragment();
  frag.appendChild(link('SD', '/'));
  var acc = '';
  for (var i = 0; i < parts.length; i++) {
    acc += '/' + parts[i];
    frag.appendChild(document.createTextNode(' / '));
    frag.appendChild(link(parts[i], acc));
  }
  var el = document.getElementById('crumbs');
  el.textContent = '';
  el.appendChild(frag);
}

function link(text, path) {
  var a = document.createElement('a');
  a.textContent = text;
  a.onclick = function () { go(path); };
  return a;
}

function btn(text, cls, fn) {
  var b = document.createElement('button');
  b.textContent = text;
  if (cls) b.className = cls;
  b.onclick = fn;
  return b;
}

function drawListing() {
  var dirs = 0, files = 0, bytes = 0;
  var table = document.createElement('table');
  var head = table.insertRow();
  ['', 'Name', 'Size', ''].forEach(function (h, i) {
    var th = document.createElement('th');
    th.textContent = h;
    if (i === 0) th.className = 'chk';
    if (i === 2) th.className = 'size';
    head.appendChild(th);
  });

  if (currentPath !== '/') {
    var up = currentPath.substring(0, currentPath.lastIndexOf('/')) || '/';
    var r = table.insertRow();
    r.insertCell().className = 'chk';
    var c = r.insertCell();
    c.className = 'name';
    c.colSpan = 3;
    c.appendChild(link('↑ ..', up));
  }

  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    var p = join(currentPath, e.name);
    var row = table.insertRow();

    var box = document.createElement('input');
    box.type = 'checkbox';
    box.className = 'sel';
    box.value = p;
    box.onchange = syncSel;
    var cb = row.insertCell();
    cb.className = 'chk';
    cb.appendChild(box);

    var nameCell = row.insertCell();
    nameCell.className = 'name';
    if (e.isDirectory) {
      dirs++;
      nameCell.appendChild(document.createTextNode('📁 '));
      nameCell.appendChild(link(e.name, p));
    } else {
      files++;
      bytes += e.size;
      var a = document.createElement('a');
      a.textContent = e.name;
      a.href = '/download?path=' + encodeURIComponent(p);
      nameCell.appendChild(document.createTextNode('📄 '));
      nameCell.appendChild(a);
    }

    var sizeCell = row.insertCell();
    sizeCell.className = 'size';
    sizeCell.textContent = e.isDirectory ? '' : fmtSize(e.size);

    var act = row.insertCell();
    act.className = 'act';
    act.appendChild(btn('Rename', '', makeRename(p, e.name)));
    if (!e.isDirectory) act.appendChild(btn('Move', '', makeMove(p)));
    act.appendChild(btn('Del', 'danger', makeDelete(p)));
  }

  var out = document.getElementById('listing');
  out.textContent = '';
  if (entries.length === 0 && currentPath === '/') {
    out.textContent = 'Empty folder.';
  } else {
    out.appendChild(table);
  }

  document.getElementById('summary').textContent =
    dirs + ' folder(s), ' + files + ' file(s), ' + fmtSize(bytes);
  syncSel();
}

function makeRename(p, name) { return function () { openRename(p, name); }; }
function makeMove(p) { return function () { openMove(p); }; }
function makeDelete(p) { return function () { deleteOne(p); }; }

function syncSel() {
  var n = document.querySelectorAll('.sel:checked').length;
  document.getElementById('delSelBtn').disabled = n === 0;
}

function selected() {
  var out = [];
  var boxes = document.querySelectorAll('.sel:checked');
  for (var i = 0; i < boxes.length; i++) out.push(boxes[i].value);
  return out;
}

function go(path) {
  currentPath = path || '/';
  load();
}

function load() {
  drawCrumbs();
  document.getElementById('listing').textContent = 'Loading…';
  fetch('/api/files?path=' + encodeURIComponent(currentPath) + '&_=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      entries = data.sort(function (a, b) {
        if (a.isDirectory !== b.isDirectory) return a.isDirectory ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      drawListing();
    })
    .catch(function (e) {
      document.getElementById('listing').textContent = 'Failed to list: ' + e.message;
    });
}

function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  }).then(function (r) {
    return r.text().then(function (t) {
      if (!r.ok) throw new Error(t || ('HTTP ' + r.status));
      return t;
    });
  });
}

function openUpload() {
  document.getElementById('uploadDest').textContent = currentPath;
  document.getElementById('progress').textContent = '';
  document.getElementById('uploadInput').value = '';
  openModal('uploadModal');
}

function startUpload() {
  var files = document.getElementById('uploadInput').files;
  if (!files.length) { toast('Pick a file first.'); return; }
  var goBtn = document.getElementById('uploadGo');
  var prog = document.getElementById('progress');
  goBtn.disabled = true;
  var i = 0;
  var failed = [];

  function next() {
    if (i >= files.length) {
      goBtn.disabled = false;
      prog.textContent = failed.length
        ? 'Done. Failed: ' + failed.join(', ')
        : 'All ' + files.length + ' file(s) uploaded.';
      load();
      return;
    }
    var f = files[i];
    var fd = new FormData();
    fd.append('file', f);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload?path=' + encodeURIComponent(currentPath), true);
    xhr.upload.onprogress = function (e) {
      if (!e.lengthComputable) return;
      prog.textContent = '[' + (i + 1) + '/' + files.length + '] ' + f.name + ' — '
                       + Math.round(100 * e.loaded / e.total) + '%';
    };
    xhr.onload = function () {
      if (xhr.status !== 200) failed.push(f.name);
      i++;
      next();
    };
    xhr.onerror = function () { failed.push(f.name); i++; next(); };
    xhr.send(fd);
  }
  next();
}

function openMkdir() {
  document.getElementById('mkdirName').value = '';
  openModal('mkdirModal');
}

function doMkdir() {
  var name = document.getElementById('mkdirName').value.trim();
  if (!name) { toast('Name cannot be empty.'); return; }
  post('/mkdir', 'name=' + encodeURIComponent(name)
                + '&path=' + encodeURIComponent(currentPath))
    .then(function () { closeModal('mkdirModal'); load(); })
    .catch(function (e) { toast('Create failed: ' + e.message); });
}

function openRename(path, name) {
  renameTarget = path;
  document.getElementById('renameName').value = name;
  openModal('renameModal');
}

function doRename() {
  var name = document.getElementById('renameName').value.trim();
  if (!name) { toast('Name cannot be empty.'); return; }
  post('/rename', 'path=' + encodeURIComponent(renameTarget)
                 + '&name=' + encodeURIComponent(name))
    .then(function () { closeModal('renameModal'); load(); })
    .catch(function (e) { toast('Rename failed: ' + e.message); });
}

function openMove(path) {
  moveTarget = path;
  document.getElementById('moveDest').value = path;
  openModal('moveModal');
}

function doMove() {
  var dest = document.getElementById('moveDest').value.trim();
  if (!dest) { toast('Destination cannot be empty.'); return; }
  post('/move', 'path=' + encodeURIComponent(moveTarget)
               + '&dest=' + encodeURIComponent(dest))
    .then(function () { closeModal('moveModal'); load(); })
    .catch(function (e) { toast('Move failed: ' + e.message); });
}

function del(paths) {
  post('/delete', 'paths=' + encodeURIComponent(JSON.stringify(paths)))
    .then(function () { load(); })
    .catch(function (e) { toast('Delete failed: ' + e.message); load(); });
}

function deleteOne(path) {
  if (confirm('Delete ' + path + '?')) del([path]);
}

function deleteSelected() {
  var paths = selected();
  if (!paths.length) return;
  if (confirm('Delete ' + paths.length + ' item(s)?')) del(paths);
}

function loadStatus() {
  fetch('/api/status')
    .then(function (r) { return r.json(); })
    .then(function (s) {
      document.getElementById('status').textContent =
        'TrailInk ' + s.version + ' • ' + s.device + ' • ' + s.ip
        + ' • heap ' + fmtSize(s.freeHeap);
    })
    .catch(function () {});
}

load();
loadStatus();
</script>
</body>
</html>
